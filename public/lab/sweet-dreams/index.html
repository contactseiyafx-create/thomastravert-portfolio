<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1442" />
  <title>Sweet Dreams — An Interactive Bedtime Campaign</title>
  <meta name="description" content="Help Nubi fall asleep in a 30-second interactive bedtime ritual." />
  <meta property="og:title" content="Sweet Dreams" />
  <meta property="og:description" content="A little magic before bedtime. Help Nubi fall asleep." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M14 2a10 10 0 1 0 8 15A8 8 0 0 1 14 2z' fill='%23FFEDA6'/%3E%3C/svg%3E" />

  <!-- Fonts from the Figma reference: Fredoka (display), Nunito (interface), Zen Maru Gothic (Japanese) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Background art is the first thing users see: start fetching it immediately -->
  <link rel="preload" as="image" href="assets/backgrounds/welcome.svg" />

  <!-- Design tokens (also mapped to Tailwind in tailwind.config.js for build-based setups) -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/tailwind.css" />

  <!-- ES modules from CDNs: no build step, deploys to Netlify as static files.
       Three.js + React Three Fiber are only downloaded when a Blender model is configured. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "htm": "https://esm.sh/htm@3.1.1",
      "gsap": "https://esm.sh/gsap@3.12.5",
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Sweet Dreams needs JavaScript to play.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
